<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrocAI · Ops</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px 16px 56px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{font-size:28px;margin:4px 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#666;margin:0}.pill{padding:7px 10px;border-radius:999px;background:#e8e8e3;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:white;border:1px solid #dddcd5;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.card span{display:block;color:#666;font-size:12px}.card strong{font-size:20px;display:block;margin:6px 0}.ok{color:#176b37}.bad{color:#a92323}.warn{color:#946200}.panel{margin-top:14px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}button{border:1px solid #c9c8bf;background:#fafaf8;border-radius:10px;padding:13px 12px;font-weight:700;text-align:left;cursor:pointer}button:hover{background:#f0f0eb}button.danger{border-color:#d9aaaa}.auth{display:flex;gap:8px;align-items:center}.auth input{min-width:220px;padding:10px;border:1px solid #ccc;border-radius:9px}.log{white-space:pre-wrap;background:#171717;color:#efefef;border-radius:10px;padding:12px;min-height:72px;max-height:260px;overflow:auto;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.muted{color:#6d6d67;font-size:13px}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.auth{width:100%;flex-wrap:wrap}.auth input{flex:1;min-width:180px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header><div><p class="eyebrow">BrocAI · Control plane</p><h1>Console Ops</h1><p class="muted">Actions bornées uniquement · aucun terminal web.</p></div><div class="auth"><input id="token" type="password" placeholder="Token Ops"><button id="save">Déverrouiller</button></div></header>
<section class="grid">
<div class="card"><span>PUBLIC HOST</span><strong id="origin">—</strong><small id="originHint">route Cloudflare</small></div>
<div class="card"><span>VPS</span><strong id="vps">—</strong><small>app + tunnel</small></div>
<div class="card"><span>MAC STANDBY</span><strong id="mac">—</strong><small>app + tunnel</small></div>
<div class="card"><span>OPS TUNNEL</span><strong id="ops">—</strong><small>console privée</small></div>
<div class="card"><span>DERNIÈRE SYNC</span><strong id="sync">—</strong><small id="commit">—</small></div>
<div class="card"><span>ÉTAT</span><strong id="overall">—</strong><small>rafraîchi toutes les 10 s</small></div>
</section>
<section class="panel"><p class="eyebrow">Actions</p><div class="actions">
<button data-action="sync">↻ Sync now<span class="muted">VPS → Mac si VPS public</span></button>
<button data-action="restart-services" data-confirm="RESTART">Restart services<span class="muted">backend + frontend VPS</span></button>
<button data-action="restart-tunnel" data-confirm="TUNNEL">Restart tunnel<span class="muted">cloudflared VPS</span></button>
<button class="danger" data-action="reboot-vps" data-confirm="REBOOT">Reboot VPS<span class="muted">redémarrage complet</span></button>
<button class="danger" data-action="failover-mac" data-confirm="FAILOVER">Failover → Mac<span class="muted">sync + validation + bascule DNS</span></button>
<button class="danger" data-action="failback-vps" data-confirm="FAILBACK">Failback → VPS<span class="muted">maintenance courte + retour des données</span></button>
</div></section>
<section class="panel"><p class="eyebrow">Résultat</p><pre id="log" class="log">Console prête.</pre></section>
</main>
<script>
const $=id=>document.getElementById(id); const key='brocai-ops-token'; $('token').value=sessionStorage.getItem(key)||'';
$('save').onclick=()=>{sessionStorage.setItem(key,$('token').value.trim()); refresh()};
function token(){return $('token').value.trim()}
function mark(el,ok,text){el.textContent=text;el.className=ok?'ok':'bad'}
function age(sec){if(sec==null)return 'jamais';if(sec<60)return sec+' s';if(sec<3600)return Math.round(sec/60)+' min';return (sec/3600).toFixed(1)+' h'}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Ops-Token':token(),...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.output||'Erreur Ops');return d}
async function refresh(){if(!token())return;try{const d=await api('/api/status');$('origin').textContent=(d.public_origin||'unknown').toUpperCase();$('origin').className=d.public_origin==='vps'?'ok':d.public_origin==='mac'?'warn':'bad';mark($('vps'),d.vps_ready&&d.vps_tunnel,d.vps_ready&&d.vps_tunnel?'READY':'PROBLÈME');mark($('mac'),d.mac_ready&&d.mac_tunnel,d.mac_ready&&d.mac_tunnel?'READY':'PROBLÈME');mark($('ops'),d.ops_tunnel,d.ops_tunnel?'READY':'PROBLÈME');$('sync').textContent=age(d.standby_sync_age_seconds);$('commit').textContent=d.standby_commit?d.standby_commit.slice(0,8):'aucun commit';const fresh=d.standby_sync_age_seconds!=null&&d.standby_sync_age_seconds<=300;mark($('overall'),d.vps_ready&&d.mac_ready&&d.ops_tunnel&&fresh,(d.vps_ready&&d.mac_ready&&d.ops_tunnel&&fresh)?'✅ OK':'⚠ À VOIR')}catch(e){$('log').textContent=String(e)}}
for(const b of document.querySelectorAll('[data-action]'))b.onclick=async()=>{const action=b.dataset.action,confirmWord=b.dataset.confirm;if(confirmWord&&!window.confirm(`Confirmer ${action} ?`))return;b.disabled=true;$('log').textContent=`${action}…`;try{const d=await api('/api/actions/'+action,{method:'POST',body:JSON.stringify({confirm:confirmWord||''})});$('log').textContent=d.output||'OK';await refresh()}catch(e){$('log').textContent=String(e)}finally{b.disabled=false}};
refresh();setInterval(refresh,10000);
</script></body></html>
