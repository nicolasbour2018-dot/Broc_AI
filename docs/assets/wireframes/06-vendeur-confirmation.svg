  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:25px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}.line{stroke:#222;stroke-width:3;fill:none}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">Brocai</text>
  <circle cx="195" cy="190" r="46" fill="#dedede" stroke="#777"/><path d="M174 190l14 14 27-31" class="line"/>
