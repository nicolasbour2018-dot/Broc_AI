<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">États IA en cours et erreur</title><desc id="desc">Référence mobile pour l’état en cours et un message d’erreur récupérable.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}.line{stroke:#777;stroke-width:2;fill:none}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">État de l’analyse</text>
  <text x="24" y="112" class="small muted">État en cours</text><rect x="24" y="126" width="342" height="138" rx="10" class="card"/><circle cx="62" cy="178" r="18" fill="#dedede" stroke="#777"/><path d="M62 162v16l11 8" class="line"/><text x="96" y="170" class="button">Analyse en cours</text><text x="96" y="198" class="body">Nous examinons votre photo.</text><text x="96" y="226" class="small muted">Gardez cette page ouverte ou naviguez ailleurs.</text>
  <text x="24" y="316" class="small muted">État erreur</text><rect x="24" y="330" width="342" height="192" rx="10" class="card"/><text x="44" y="370" class="button">L’analyse est indisponible</text><text x="44" y="402" class="body">Votre photo n’a pas été publiée.</text><text x="44" y="430" class="body">Réessayez dans un instant.</text><text x="44" y="462" class="small muted">Le mini-marché reste disponible.</text>
  <rect x="24" y="554" width="342" height="52" rx="8" class="card"/><text x="195" y="587" text-anchor="middle" class="button">Voir le mini-marché</text>
  <rect x="24" y="760" width="342" height="52" rx="8" class="dark"/><text x="195" y="793" text-anchor="middle" class="button" fill="#fff">Réessayer l’analyse</text>
</svg>
