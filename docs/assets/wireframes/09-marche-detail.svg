  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">‹ Annonce</text>
  <rect x="24" y="92" width="342" height="220" rx="10" fill="#dedede" stroke="#777"/><path d="M50 280l78-84 58 53 44-46 110 77" fill="none" stroke="#777" stroke-width="4"/>
