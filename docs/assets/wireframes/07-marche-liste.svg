  <rect x="24" y="502" width="342" height="132" rx="8" class="card"/><rect x="40" y="518" width="96" height="96" rx="5" fill="#dedede"/><text x="154" y="546" class="button">Jeu de société</text><text x="154" y="576" class="body">6 €</text><text x="154" y="604" class="body">Stand C07</text>
