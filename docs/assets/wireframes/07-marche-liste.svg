<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Mini-marché, liste des annonces</title><desc id="desc">Liste mobile d’annonces avec prix, stand et recherche accessible.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:13px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.input{fill:#fff;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
