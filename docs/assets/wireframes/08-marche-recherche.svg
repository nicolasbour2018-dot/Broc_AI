<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Mini-marché, recherche</title><desc id="desc">Recherche mobile pour lampe, avec résultat et accès au stand.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.input{fill:#fff;stroke:#222;stroke-width:2}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">‹ Recherche</text>
  <rect x="24" y="92" width="342" height="52" rx="8" class="input"/><text x="44" y="125" class="body">lampe</text><text x="330" y="125" class="body muted">×</text>
