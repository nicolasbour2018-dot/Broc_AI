  <rect x="24" y="426" width="342" height="52" rx="8" class="card"/><text x="195" y="459" text-anchor="middle" class="button">Effacer la recherche</text>
  <rect x="24" y="760" width="342" height="52" rx="8" class="dark"/><text x="195" y="793" text-anchor="middle" class="button" fill="#fff">Voir l’annonce</text>
