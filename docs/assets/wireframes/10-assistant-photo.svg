<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Assistant photo, prise de vue</title><desc id="desc">Écran mobile pour photographier un objet et lancer une analyse automatique.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.line{stroke:#777;stroke-width:2;fill:none}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">‹ J’analyse</text>
  <text x="24" y="118" class="title">Photographiez un objet</text><text x="24" y="148" class="body muted">L’analyse démarre automatiquement.</text>
  <rect x="24" y="184" width="342" height="298" rx="10" class="card" stroke-dasharray="6 5"/><circle cx="195" cy="290" r="42" fill="#dedede" stroke="#777"/><circle cx="195" cy="290" r="16" fill="#fff" stroke="#777"/><path d="M132 392h126" class="line"/><text x="195" y="424" text-anchor="middle" class="body">Centrez l’objet dans le cadre</text><text x="195" y="450" text-anchor="middle" class="small muted">Pas besoin d’écrire une demande.</text>
  <rect x="24" y="516" width="342" height="52" rx="8" class="card"/><text x="195" y="549" text-anchor="middle" class="button">Choisir une photo</text>
  <rect x="24" y="760" width="342" height="52" rx="8" class="dark"/><text x="195" y="793" text-anchor="middle" class="button" fill="#fff">Prendre une photo</text>
</svg>
