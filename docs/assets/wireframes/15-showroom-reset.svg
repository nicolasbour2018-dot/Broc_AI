<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Showroom, hub et remise à zéro</title><desc id="desc">Hub de démonstrations fictives avec une action de réinitialisation clairement accessible.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:13px}.body{font-size:16px}.title{font-size:24px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">Showroom</text><text x="274" y="50" class="small muted">Mode démo</text>
  <text x="24" y="114" class="body">Choisissez une démonstration.</text><text x="24" y="140" class="small muted">Données et actions simulées.</text>
  <rect x="24" y="170" width="164" height="112" rx="8" class="card"/><text x="44" y="212" class="button">Rocky</text><text x="44" y="240" class="small muted">Recrutement simulé</text>
  <rect x="202" y="170" width="164" height="112" rx="8" class="card"/><text x="222" y="212" class="button">Basket</text><text x="222" y="240" class="small muted">Données figées</text>
  <rect x="24" y="300" width="164" height="112" rx="8" class="card"/><text x="44" y="342" class="button">Garage</text><text x="44" y="370" class="small muted">Atelier simulé</text>
  <rect x="202" y="300" width="164" height="112" rx="8" class="card"/><text x="222" y="342" class="button">Jarvis</text><text x="222" y="370" class="small muted">Maison simulée</text>
  <rect x="24" y="454" width="342" height="112" rx="10" class="card"/><text x="44" y="492" class="button">Fin de visite ?</text><text x="44" y="520" class="body">Effacez le scénario et les échanges locaux.</text><text x="44" y="546" class="small muted">Aucune action externe réelle n’a été effectuée.</text>
  <rect x="24" y="760" width="342" height="52" rx="8" class="dark"/><text x="195" y="793" text-anchor="middle" class="button" fill="#fff">Réinitialiser la démo</text>
</svg>
