<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Accueil Brocai</title><desc id="desc">Accueil mobile avec les trois choix Je vends, Je cherche et J’analyse.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:26px;font-weight:700}.button{font-size:18px;font-weight:700}.muted{fill:#666}.line{stroke:#777;stroke-width:1.5}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/>
  <text x="32" y="50" class="title">Brocai</text><text x="310" y="50" class="small muted">Accueil</text>
  <text x="24" y="118" class="title">Que voulez-vous faire ?</text><text x="24" y="148" class="body muted">Une action simple, sans compte.</text>
  <rect x="24" y="184" width="342" height="112" rx="10" class="card"/><text x="48" y="226" class="button">Je vends</text><text x="48" y="258" class="body muted">Créer une annonce depuis une photo</text><circle cx="330" cy="240" r="18" fill="#dedede" stroke="#777"/><path d="M322 240h16m-8-8 8 8-8 8" class="line"/>
  <rect x="24" y="316" width="342" height="112" rx="10" class="card"/><text x="48" y="358" class="button">Je cherche</text><text x="48" y="390" class="body muted">Trouver un objet et son stand</text><circle cx="330" cy="372" r="18" fill="#dedede" stroke="#777"/><path d="M322 372h16m-8-8 8 8-8 8" class="line"/>
  <rect x="24" y="448" width="342" height="112" rx="10" class="card"/><text x="48" y="490" class="button">J’analyse</text><text x="48" y="522" class="body muted">Comprendre un objet en photo</text><circle cx="330" cy="504" r="18" fill="#dedede" stroke="#777"/><path d="M322 504h16m-8-8 8 8-8 8" class="line"/>
  <text x="24" y="632" class="body">Vos données restent minimales.</text><text x="24" y="658" class="small muted">Pas de compte. Les réponses IA restent indicatives.</text>
</svg>
