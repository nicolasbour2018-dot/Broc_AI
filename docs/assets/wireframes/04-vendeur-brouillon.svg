<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Vendeur, brouillon modifiable</title><desc id="desc">Formulaire mobile prérempli par l’analyse IA avec les champs éditables et le stand obligatoire.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:13px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.input{fill:#fff;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">‹ Brouillon</text><text x="277" y="50" class="small muted">Étape 2/3</text>
  <rect x="24" y="92" width="342" height="54" rx="8" class="card"/><text x="42" y="116" class="small">Analyse IA terminée</text><text x="42" y="136" class="small muted">Vérifiez et modifiez librement chaque champ.</text>
  <text x="24" y="180" class="small">Titre</text><rect x="24" y="190" width="342" height="48" rx="6" class="input"/><text x="40" y="221" class="body">Lampe de bureau articulée</text>
  <text x="24" y="270" class="small">Description</text><rect x="24" y="280" width="342" height="82" rx="6" class="input"/><text x="40" y="311" class="body">Métal gris, bon état.</text><text x="40" y="338" class="body">Ampoule non fournie.</text>
  <text x="24" y="394" class="small">Catégorie</text><rect x="24" y="404" width="342" height="48" rx="6" class="input"/><text x="40" y="435" class="body">Décoration</text>
  <text x="24" y="484" class="small">Prix final (€)</text><rect x="24" y="494" width="160" height="48" rx="6" class="input"/><text x="40" y="525" class="body">15</text><text x="202" y="525" class="small muted">Suggestion IA : 12–18 €</text>
  <text x="24" y="574" class="small">Numéro de stand *</text><rect x="24" y="584" width="342" height="48" rx="6" class="input"/><text x="40" y="615" class="body">B12</text><text x="24" y="660" class="small muted">Pseudo vendeur (facultatif)</text>
  <rect x="24" y="760" width="342" height="52" rx="8" class="dark"/><text x="195" y="793" text-anchor="middle" class="button" fill="#fff">Prévisualiser l’annonce</text>
</svg>
