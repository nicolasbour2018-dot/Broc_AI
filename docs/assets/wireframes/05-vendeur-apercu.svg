<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Vendeur, aperçu avant publication</title><desc id="desc">Aperçu d’une annonce et actions pour revenir modifier ou publier.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#222}.small{font-size:14px}.body{font-size:16px}.title{font-size:23px;font-weight:700}.button{font-size:17px;font-weight:700}.muted{fill:#666}.card{fill:#f3f3f3;stroke:#777;stroke-width:1.5}.dark{fill:#222}.white{fill:#fff}</style>
  <rect width="390" height="844" fill="#fff"/><rect x="16" y="16" width="358" height="56" rx="8" class="card"/><text x="32" y="50" class="title">‹ Aperçu</text><text x="278" y="50" class="small muted">Étape 3/3</text>
  <text x="24" y="116" class="title">Avant de publier</text><text x="24" y="146" class="body muted">Voici ce que verront les visiteurs.</text>
  <rect x="24" y="180" width="342" height="396" rx="10" class="card"/><rect x="42" y="200" width="306" height="166" rx="6" fill="#dedede"/><path d="M70 338l75-76 54 48 42-40 78 68" fill="none" stroke="#777" stroke-width="3"/><text x="42" y="406" class="title">Lampe de bureau articulée</text><text x="42" y="438" class="body">15 €</text><text x="42" y="470" class="body">Stand B12</text><text x="42" y="504" class="small muted">Décoration · Métal gris, bon état.</text><text x="42" y="534" class="small muted">Publié aujourd’hui</text>
  <rect x="24" y="606" width="342" height="52" rx="8" class="card"/><text x="195" y="639" text-anchor="middle" class="button">Modifier le brouillon</text>
  <rect x="24" y="760" width="342" height="52" rx="8" class="dark"/><text x="195" y="793" text-anchor="middle" class="button" fill="#fff">Publier l’annonce</text>
</svg>
